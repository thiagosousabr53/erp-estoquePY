<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Despesa | Financify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .edit-card {
            max-width: 600px;
            margin: 2rem auto;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card edit-card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">✏️ Editar Despesa</h4>
            </div>
            <div class="card-body">
                <form action="/edit/{{ despesa.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Descrição:</label>
                        <input type="text" name="descricao" class="form-control" value="{{ despesa.descricao }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Valor (R$):</label>
                        <input type="number" name="valor" class="form-control" step="0.01" value="{{ despesa.valor }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Data:</label>
                        <input type="date" name="data" class="form-control" value="{{ despesa.data }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Salvar Alterações
                        </button>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Voltar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
